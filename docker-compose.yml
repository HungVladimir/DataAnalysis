Tạo thêm một file cạnh đó tên là .env và dán nội dung này vào: 
GEMINI_API_KEY=your_gemini_api_key_here
POSTGRES_HOST=localhost
POSTGRES_PORT=5432
POSTGRES_DB=bigdata_db
POSTGRES_USER=bigdata_user
POSTGRES_PASSWORD=BigDataPass123
MONGO_HOST=localhost
MONGO_PORT=27017
NEO4J_URI=bolt://localhost:7687
NEO4J_USER=neo4j
NEO4J_PASSWORD=BigDataPass123
KAFKA_BOOTSTRAP_SERVERS=localhost:9092
Mở Docker Tesktop ra và quay lại Antigravity mở terminal lên (Ctrl + ~) và chạy lệnh “docker compose up -d”. Kết quả như ảnh dưới là xong.




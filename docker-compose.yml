Thực hành 3: Cài đặt Docker và các môi trường khác

tCài đặt Docker Destop 

Việc cài đặt trực tiếp Hadoop (vốn sinh ra cho hệ điều hành Linux) lên Windows theo chuẩn Pseudo-distributed thủ công rất phức tạp, dễ lỗi cấu hình Java, biến môi trường và tốn rất nhiều thời gian sửa lỗi vặt. Trong khi đó, Docker đóng gói sẵn mọi thứ vào một container chạy mượt mà, cô lập và sạch sẽ.. Dùng Docker giúp anh chị gói gọn mọi thứ trong một container biệt lập, máy Windows của anh chị không sợ bị xung đột file hệ thống hay lỗi môi trường. 

Cài đặt WSL 2 trên Windows 11 
Mở PowerShell bằng quyền Administrator (Nhấn phím Windows, gõ PowerShell, chuột phải chọn Run as administrator). 
	
Chạy lệnh wsl --install để bật WSL và cài đặt nhân Linux mặc định (anh chị đợi lệnh chạy xong vì sẽ mất một thời gian tương đối)
	
Khởi động lại máy tính (Restart) và mở lại PowerShell bằng quyền Administrator (bước b)
Chạy lệnh “wsl --version” để kiểm tra xem wsl đã được cài chưa
 
Tải và cài đặt Docker Desktop for Windows từ trang chủ Docker
Chạy file vừa tải về. Ở bảng thông báo cấu hình, hãy đảm bảo tích chọn mục "Use WSL 2 instead of Hyper-V" (nếu có)
Mở Docker Destop và chọn Accept
	
Tạo tài khoản hoặc đăng nhập vào mail
	
	
	
Đợi đến khi biểu tượng ở góc dưới bên trái là được. Như của ad là “✓ v4.87.0“


Cài đặt các môi trường qua Docker
Mở AntiGravity IDE lên và chọn vào thư mục Thực hành của bạn (ví dụ D:\NguyenMinhHuong\TA\SS_Bigdata\) 
Chọn new file và đặt tên cho file đó là docker-compose.yml, sau đó dán nội dung sau vào
	

version: '3.8'

networks:
  bigdata-network:
    name: bigdata-network
    driver: bridge

volumes:
  hadoop_namenode:
  hadoop_datanode:
  postgres_data:
  mongodb_data:
  neo4j_data:
  neo4j_plugins:
  kafka_data:

services:
  # 2. RELATIONAL SQL DATABASE (POSTGRESQL & PGADMIN 4 WEB GUI)
  postgres:
    image: postgres:15-alpine
    container_name: bigdata-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=bigdata_db
      - POSTGRES_USER=bigdata_user
      - POSTGRES_PASSWORD=BigDataPass123
    ports:
      - "5432:5432" # PostgreSQL Port
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bigdata-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bigdata-pgadmin-ui
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@bigdata.edu.vn
      - PGADMIN_DEFAULT_PASSWORD=BigDataPass123
      - PGADMIN_LISTEN_PORT=80
    ports:
      - "5050:80" # pgAdmin 4 Web UI
    depends_on:
      - postgres
    networks:
      - bigdata-network

  # 3. HADOOP ECOSYSTEM (HDFS NAMENODE & DATANODE)
  hadoop-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: bigdata-hadoop-namenode
    restart: unless-stopped
    environment:
      - CLUSTER_NAME=bigdata_cluster
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:9000
      - HDFS_CONF_dfs_replication=1
    ports:
      - "9870:9870" # HDFS NameNode Web UI
      - "9000:9000" # HDFS RPC Port
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    networks:
      - bigdata-network

  hadoop-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: bigdata-hadoop-datanode
    restart: unless-stopped
    environment:
      - CLUSTER_NAME=bigdata_cluster
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:9000
      - HDFS_CONF_dfs_replication=1
    ports:
      - "9864:9864" # HDFS DataNode Web UI
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    depends_on:
      - hadoop-namenode
    networks:
      - bigdata-network


  # 5. NOSQL DATABASE (MONGODB & MONGO EXPRESS GUI)
  mongodb:
    image: mongo:6.0
    container_name: bigdata-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017" # MongoDB Port
    volumes:
      - mongodb_data:/data/db
    networks:
      - bigdata-network

  mongo-express:
    image: mongo-express:latest
    container_name: bigdata-mongo-ui
    restart: unless-stopped
    ports:
      - "8081:8081" # Mongo Express Web UI
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongodb
    networks:
      - bigdata-network
